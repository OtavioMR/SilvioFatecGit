<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evidências da atividade de Git</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #101426;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(1.25rem, 5vw, 4rem);
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #312e81 0, #101426 58%);
    }

    main { width: min(100%, 900px); }

    .topline {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: #c4b5fd;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: #a78bfa; }

    .card {
      margin-top: 1.25rem;
      padding: clamp(1.5rem, 5vw, 3.25rem);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 30px 100px rgba(3, 5, 20, 0.38);
      backdrop-filter: blur(20px);
    }

    .number { color: #a78bfa; font-size: 0.95rem; font-weight: 700; }
    h1 { margin: 0.55rem 0 0.75rem; font-size: clamp(1.75rem, 5vw, 2.8rem); line-height: 1.12; }
    .summary { max-width: 70ch; color: #cbd5e1; font-size: 1.05rem; line-height: 1.65; }
    h2 { margin: 1.75rem 0 0.65rem; color: #ddd6fe; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }
    pre {
      overflow-x: auto;
      margin: 0;
      padding: 1rem 1.2rem;
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 0.9rem;
      color: #e2e8f0;
      background: rgba(7, 10, 25, 0.76);
      font: 0.92rem/1.6 ui-monospace, "Cascadia Code", Consolas, monospace;
      white-space: pre-wrap;
    }

    .result { border-color: rgba(52, 211, 153, 0.22); color: #d1fae5; }
    .foot { margin-top: 1.1rem; color: #94a3b8; font-size: 0.85rem; }
    .nav { display: flex; justify-content: space-between; margin-top: 1rem; }
    a { color: #c4b5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media print {
      :root, body { color: #111827; background: #fff; }
      .card { border-color: #cbd5e1; background: #fff; box-shadow: none; }
      pre { color: #111827; background: #f1f5f9; }
      .summary, .foot { color: #475569; }
    }
  </style>
</head>
<body>
  <main>
    <div class="topline"><span class="dot" aria-hidden="true"></span> Atividade prática · Git</div>
    <section class="card" aria-live="polite">
      <div class="number" id="number"></div>
      <h1 id="title"></h1>
      <p class="summary" id="summary"></p>
      <h2>Comandos registrados</h2>
      <pre id="commands"></pre>
      <h2>Resultado observado</h2>
      <pre class="result" id="result"></pre>
      <div class="foot" id="foot"></div>
      <nav class="nav"><a id="previous" href="#">← passo anterior</a><a id="next" href="#">próximo passo →</a></nav>
    </section>
  </main>
  <script>
    const steps = [
      { id: "01", title: "Ferramentas e configuração", summary: "Git estava instalado e a identidade de commit já estava configurada no perfil global. As configurações globais não foram modificadas.", commands: "git --version\ngit config --get user.name\ngit config --local alias.st status\ngit st --short --branch", result: "git version 2.56.0.windows.2\nAliases de exemplo configurados somente neste repositório.\nBranch ativa: main.", foot: "A atividade foi isolada na pasta ola-professor." },
      { id: "02", title: "Projeto Olá, Professor", summary: "Estrutura criada com HTML, CSS e JavaScript, incluindo saudação por horário, estilo responsivo, animação discreta e .gitignore.", commands: "git init -b main\ngit add index.html style.css app.js .gitignore\ngit commit -m \"feat: cria página olá professor\"", result: "[main 9528fa0] feat: cria página olá professor\n4 arquivos criados · 122 linhas adicionadas\nPágina aberta no navegador local.", foot: "A captura 01 mostra a página executando no navegador." },
      { id: "03", title: "Ciclo básico: add, commit e log", summary: "Uma correção de estilo foi revisada com diff e registrada usando commit -am, que inclui alterações em arquivos já rastreados.", commands: "git diff\ngit commit -am \"fix: melhora contraste da etiqueta\"\ngit log --oneline", result: "6c0b7da fix: melhora contraste da etiqueta\n9528fa0 feat: cria página olá professor\nÁrvore de trabalho limpa após o commit.", foot: "O alias local git st também foi usado para consultar o status." },
      { id: "04", title: "Branches e conflito resolvido", summary: "As branches feature/animacao e main alteraram a mesma linha do título. O merge parou com conflito; a resolução combinou as mensagens e removeu os marcadores.", commands: "git switch -c feature/animacao\ngit switch main\ngit merge feature/animacao\ngit status\ngit add index.html\ngit commit -m \"merge: integra animação e saudação\"", result: "CONFLICT (content): Merge conflict in index.html\n[main 349eacc] merge: integra animação e saudação\nHistórico preserva os dois lados e o commit de merge.", foot: "O texto resolvido foi: “Olá, Professor! Vamos praticar Git.”" },
      { id: "05", title: "Rebase, merge e cherry-pick", summary: "A branch de cores foi rebaseada após um commit independente em main e integrada com --no-ff. Depois, cherry-pick trouxe uma melhoria de acessibilidade específica.", commands: "git switch feature/nova-cor\ngit rebase main\ngit switch main\ngit merge --no-ff feature/nova-cor\ngit cherry-pick feature/acessibilidade-saudacao", result: "Merge preservado no histórico da paleta de cores.\nCommit de acessibilidade aplicado à main após seu avanço.\nGrafo consultado com git lg.", foot: "O rebase foi feito somente em branch local." },
      { id: "06", title: "Recuperação: restore, reset, revert e stash", summary: "Os comandos de recuperação foram exercitados em uma branch de laboratório. O reset --hard descartou somente um commit descartável dessa branch.", commands: "git restore app.js\ngit restore --staged app.js\ngit reset --soft HEAD~1\ngit reset --mixed HEAD\ngit reset --hard HEAD~1\ngit revert --no-edit HEAD\ngit stash push -m \"wip: demonstração de stash\"\ngit stash pop\ngit reflog -8 --oneline", result: "Soft e mixed mantiveram as alterações conforme esperado.\nHard removeu o ensaio isolado; revert criou commit inverso.\nStash foi aplicado e removido da pilha.\nmain não recebeu os commits descartáveis.", foot: "A branch lab/maquina-do-tempo ficou disponível para inspecionar o revert." },
      { id: "07", title: "Bisect e hook pré-commit", summary: "Bisect localizou um commit ruim em uma sequência descartável. Um hook temporário bloqueou o commit de uma linha console.log e foi removido depois da demonstração.", commands: "git bisect start\ngit bisect bad\ngit bisect good main\ngit bisect good\ngit bisect reset\ngit fsck --full\ngit clean -fdn", result: "ea866bb é o primeiro commit ruim no ensaio de bisect.\nO hook recusou o commit com: Remova console.log antes de commitar.\nO ensaio e o hook não ficaram na branch main.", foot: "git clean foi consultado apenas com -n (simulação), sem apagar arquivos." },
      { id: "08", title: "Branches, worktree e tag", summary: "O grafo foi consultado, um worktree auxiliar foi criado e removido, e a versão final recebeu tags local e anotada.", commands: "git log --oneline --graph --decorate --all\ngit worktree add ../ola-professor-worktree feature/worktree-demo\ngit worktree list\ngit worktree remove ../ola-professor-worktree\ngit tag v1.0.0 -m \"versão inicial\"\ngit tag v1.0.0-beta", result: "Worktree auxiliar removido após a inspeção.\nTags v1.0.0 e v1.0.0-beta disponíveis localmente.", foot: "As tags serão enviadas ao remote local junto com a documentação." },
      { id: "09", title: "Remote, push, fetch e clone", summary: "Para praticar operações remotas sem credenciais GitHub, foi usado um repositório bare local separado da pasta do projeto.", commands: "git remote add origin ../ola-professor-remoto.git\ngit push -u origin main\ngit fetch --all\ngit clone --depth 1 <remote-local> <pasta-temporária>\ngit branch -vv", result: "origin/main recebeu a branch main.\nClone raso local abriu em main e apontou para origin/main.\nEste remote é local; não é uma publicação no GitHub.", foot: "Para usar GitHub, substitua origin pela URL do repositório da sua conta." },
      { id: "10", title: "Deploy no Vercel", summary: "A sessão do Vercel CLI estava autenticada. O primeiro deploy da pasta criou o projeto e foi promovido automaticamente para produção.", commands: "vercel.cmd --yes\ncurl.exe -I -L https://ola-professor-cyan.vercel.app", result: "Produção: https://ola-professor-cyan.vercel.app\nHTTP/1.1 200 OK\nProjeto Vercel: otaviomrs-projects/ola-professor", foot: "A URL de produção foi aberta no navegador e respondeu sem autenticação." },
      { id: "11", title: "GitHub e documentação", summary: "A branch main e os documentos da atividade foram enviados ao repositório fornecido pelo usuário; a produção também está no ar.", commands: "git remote -v\ngit push -u origin main\ngit status --short --branch\ngit log --oneline --graph --decorate --all", result: "GitHub: github.com/OtavioMR/SilvioFatecGit\nmain acompanha origin/main.\nProdução: https://ola-professor-cyan.vercel.app\nAs tags v1.0.0 e v1.0.0-beta serão enviadas após o commit final.", foot: "A captura 13 mostra o repositório após o push inicial." }
    ];

    const params = new URLSearchParams(location.search);
    const selected = params.get("passo") || "01";
    const index = Math.max(0, steps.findIndex((step) => step.id === selected));
    const step = steps[index];
    document.title = `${step.id} · ${step.title} — Evidências Git`;
    document.getElementById("number").textContent = `PASSO ${step.id} / ${steps.length}`;
    document.getElementById("title").textContent = step.title;
    document.getElementById("summary").textContent = step.summary;
    document.getElementById("commands").textContent = step.commands;
    document.getElementById("result").textContent = step.result;
    document.getElementById("foot").textContent = step.foot;
    document.getElementById("previous").href = `?passo=${steps[Math.max(0, index - 1)].id}`;
    document.getElementById("next").href = `?passo=${steps[Math.min(steps.length - 1, index + 1)].id}`;
  </script>
</body>
</html>
